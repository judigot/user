name: Terminal Environment Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # Manual trigger

jobs:
  lint-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test PowerShell profile setup
        shell: pwsh
        run: |
          # Download and source profile.ps1
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/judigot/user/main/profile.ps1" -OutFile "$env:USERPROFILE\profile.ps1"
          . "$env:USERPROFILE\profile.ps1"
          Write-Host "PowerShell profile loaded successfully"

      - name: Test bash integration
        shell: pwsh
        run: |
          # Test that bash function works (Git Bash is pre-installed on windows-latest)
          $env:HOME = $env:USERPROFILE
          & "C:\Program Files\Git\bin\bash.exe" -c "echo 'Bash integration working'"

      - name: Test dotfiles download
        shell: pwsh
        run: |
          # Download key dotfiles
          $files = @(".bashrc", ".devrc", "ALIAS")
          foreach ($file in $files) {
            $url = "https://raw.githubusercontent.com/judigot/user/main/$file"
            $dest = "$env:USERPROFILE\$file"
            Invoke-WebRequest -Uri $url -OutFile $dest
            if (Test-Path $dest) {
              Write-Host "✓ Downloaded $file"
            } else {
              Write-Error "✗ Failed to download $file"
              exit 1
            }
          }

      - name: Test .devrc sourcing
        shell: pwsh
        run: |
          $env:HOME = $env:USERPROFILE
          & "C:\Program Files\Git\bin\bash.exe" --login -c "source ~/.devrc && echo 'devrc sourced successfully'"

      - name: Test aliases loaded
        shell: pwsh
        run: |
          $env:HOME = $env:USERPROFILE
          & "C:\Program Files\Git\bin\bash.exe" --login -c "source ~/.devrc && alias hi && echo '✓ Aliases loaded'"

      - name: Test updateUserEnv function
        shell: pwsh
        run: |
          $env:HOME = $env:USERPROFILE
          & "C:\Program Files\Git\bin\bash.exe" --login -c "source ~/.devrc && updateUserEnv && echo '✓ updateUserEnv completed'"

      - name: Test idempotence (run updateUserEnv twice)
        shell: pwsh
        run: |
          $env:HOME = $env:USERPROFILE
          & "C:\Program Files\Git\bin\bash.exe" --login -c "source ~/.devrc && updateUserEnv && updateUserEnv && echo '✓ Idempotence test passed'"

      - name: Test downloadGithubFiles function
        shell: pwsh
        run: |
          $env:HOME = $env:USERPROFILE
          & "C:\Program Files\Git\bin\bash.exe" --login -c "source ~/.devrc && downloadGithubFiles judigot/user README.md --dest /tmp/test-download && [ -f /tmp/test-download/README.md ] && echo '✓ downloadGithubFiles works' || (echo '✗ downloadGithubFiles failed' && exit 1)"

  test-windows-unzip-missing-fallback:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download key dotfiles
        shell: pwsh
        run: |
          $files = @(".bashrc", ".devrc", "ALIAS")
          foreach ($file in $files) {
            $url = "https://raw.githubusercontent.com/judigot/user/main/$file"
            $dest = "$env:USERPROFILE\$file"
            Invoke-WebRequest -Uri $url -OutFile $dest
            if (-not (Test-Path $dest)) { Write-Error "✗ Failed to download $file"; exit 1 }
          }

      - name: Test updateUserEnv fallback when unzip missing
        shell: pwsh
        run: |
          $env:HOME = $env:USERPROFILE
          & "C:\Program Files\Git\bin\bash.exe" --login -c "mkdir -p /tmp/fakeunzip && printf '%s\n' '#!/bin/sh' 'exit 1' > /tmp/fakeunzip/unzip && chmod +x /tmp/fakeunzip/unzip && PATH=/tmp/fakeunzip:\$PATH && source ~/.devrc && updateUserEnv && echo '✓ updateUserEnv succeeded without unzip'"

  test-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test dotfiles download
        run: |
          files=".bashrc .devrc ALIAS"
          for file in $files; do
            curl -fsSL "https://raw.githubusercontent.com/judigot/user/main/$file" -o "$HOME/$file"
            if [ -f "$HOME/$file" ]; then
              echo "✓ Downloaded $file"
            else
              echo "✗ Failed to download $file"
              exit 1
            fi
          done

      - name: Test .devrc sourcing
        run: |
          # shellcheck source=/dev/null
          source ~/.devrc
          echo "devrc sourced successfully"

      - name: Test aliases loaded
        run: |
          # shellcheck source=/dev/null
          source ~/.devrc
          # Verify ALIAS file was parsed
          if alias hi &>/dev/null; then
            echo "✓ Aliases loaded"
          else
            echo "✗ Aliases not loaded"
            exit 1
          fi

      - name: Test updateUserEnv function
        run: |
          # shellcheck source=/dev/null
          source ~/.devrc
          updateUserEnv
          echo "✓ updateUserEnv completed"

      - name: Test idempotence (run updateUserEnv twice)
        run: |
          # shellcheck source=/dev/null
          source ~/.devrc
          updateUserEnv
          updateUserEnv
          echo "✓ Idempotence test passed"

      - name: Test downloadGithubFiles function
        run: |
          # shellcheck source=/dev/null
          source ~/.devrc
          # Test downloading a single file
          downloadGithubFiles judigot/user README.md --dest /tmp/test-download
          if [ -f "/tmp/test-download/README.md" ]; then
            echo "✓ downloadGithubFiles single file works"
          else
            echo "✗ downloadGithubFiles failed"
            exit 1
          fi
          # Test downloading multiple files
          downloadGithubFiles judigot/user README.md DOTFILES --dest /tmp/test-multi
          if [ -f "/tmp/test-multi/README.md" ] && [ -f "/tmp/test-multi/DOTFILES" ]; then
            echo "✓ downloadGithubFiles multiple files works"
          else
            echo "✗ downloadGithubFiles multiple files failed"
            exit 1
          fi

  test-aws-config-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run AWS Config note through mocked Bitwarden
        shell: bash
        run: |
          set -euo pipefail
          HOME="$(mktemp -d)"
          export HOME
          source "$GITHUB_WORKSPACE/.devrc"

          export MOCK_AWS_ITEMS='[{"id":"aws-config-item","name":"AWS Config"}]'
          MOCK_UNLOCK_FAILURE=0
          MOCK_SYNC_FAILURE=0
          MOCK_LIST_FAILURE=0
          MOCK_SYNC_CALLED=0
          MOCK_AWS_NOTES="$(cat <<'AWS_SCRIPT'
          #!/bin/sh
          set -eu
          umask 077
          mkdir -p "$HOME/.aws"
          [ ! -e "$HOME/.aws/config" ] || exit 7
          [ ! -e "$HOME/.aws/credentials" ] || exit 8
          printf "%s\n" "[profile admin]" "region = us-east-2" > "$HOME/.aws/config"
          printf "%s\n" "mock-credentials" > "$HOME/.aws/credentials"
          AWS_SCRIPT
          )"
          export MOCK_AWS_NOTES

          bw() {
            case "$*" in
              --version) printf '%s\n' '2026.1.0' ;;
              "login --check"|"unlock --check") return 0 ;;
              "unlock --raw")
                if [ "$MOCK_UNLOCK_FAILURE" = 1 ]; then
                  printf '%s\n' 'invalid-session'
                  return 3
                fi
                printf '%s\n' 'mock-session'
                ;;
              sync)
                if [ "$MOCK_SYNC_FAILURE" = 1 ]; then
                  return 4
                fi
                MOCK_SYNC_CALLED=1
                ;;
              "list items"|"list items --search AWS Config")
                if [ "$MOCK_LIST_FAILURE" = 1 ]; then
                  return 5
                fi
                if [ "$MOCK_SYNC_CALLED" != 1 ]; then
                  printf '%s\n' '[]'
                else
                  printf '%s\n' "$MOCK_AWS_ITEMS"
                fi
                ;;
              "get item aws-config-item")
                node -e 'process.stdout.write(JSON.stringify({ notes: process.env.MOCK_AWS_NOTES }))'
                ;;
              *) return 1 ;;
            esac
          }

          useAWS
          [ "$MOCK_SYNC_CALLED" = 1 ] || {
            printf '%s\n' 'authaws must synchronize the Bitwarden vault first.' >&2
            exit 1
          }
          grep -q 'region = us-east-2' "$HOME/.aws/config"
          grep -q 'mock-credentials' "$HOME/.aws/credentials"

          if useAWS; then
            printf '%s\n' 'The AWS Config note should refuse to overwrite existing files.' >&2
            exit 1
          fi
          grep -q 'mock-credentials' "$HOME/.aws/credentials"

          MOCK_AWS_NOTES=''
          if useAWS; then
            printf '%s\n' 'An empty AWS Config note must fail.' >&2
            exit 1
          fi

          MOCK_AWS_ITEMS='[{"id":"aws-config-item","name":"AWS Config"},{"id":"other","name":"AWS Config"}]'
          if useAWS; then
            printf '%s\n' 'Duplicate AWS Config items must fail.' >&2
            exit 1
          fi

          MOCK_UNLOCK_FAILURE=1
          MOCK_AWS_ITEMS='[{"id":"aws-config-item","name":"AWS Config"}]'
          if useAWS; then
            printf '%s\n' 'A failed Bitwarden unlock must stop execution.' >&2
            exit 1
          fi

          MOCK_UNLOCK_FAILURE=0
          MOCK_SYNC_FAILURE=1
          if useAWS; then
            printf '%s\n' 'A failed vault sync must stop execution.' >&2
            exit 1
          fi

          MOCK_SYNC_FAILURE=0
          MOCK_LIST_FAILURE=1
          if useAWS; then
            printf '%s\n' 'A failed vault search must stop execution.' >&2
            exit 1
          fi

          MOCK_LIST_FAILURE=0
          MOCK_AWS_ITEMS='[]'
          if useAWS; then
            printf '%s\n' 'Missing AWS Config must not silently succeed.' >&2
            exit 1
          fi

  test-node-env-strict-bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify strict-mode Node setup and shell state restoration
        shell: bash
        run: |
          test_home="$(mktemp -d)"
          export HOME="$test_home"
          mkdir -p "$HOME/.nvm"
          printf '%s\n' "nvm() { : \"\${PROVIDED_VERSION}\"; }" > "$HOME/.nvm/nvm.sh"

          source "$GITHUB_WORKSPACE/.devrc"
          bun() { :; }
          pnpm() { :; }
          trap ':' RETURN
          original_trap="$(trap -p RETURN)"

          set -euo pipefail
          setupNodeEnv
          [[ "$-" == *u* ]]
          [[ "$(trap -p RETURN)" == "$original_trap" ]]

          _setupNodeEnv_impl() { return 17; }
          if setupNodeEnv; then
            printf '%s\n' 'Expected setupNodeEnv failure to propagate' >&2
            exit 1
          else
            status=$?
          fi
          [[ "$status" -eq 17 ]]
          [[ "$-" == *u* ]]
          [[ "$(trap -p RETURN)" == "$original_trap" ]]

          set +u
          if setupNodeEnv; then
            printf '%s\n' 'Expected setupNodeEnv failure to propagate without nounset' >&2
            exit 1
          else
            status=$?
          fi
          [[ "$status" -eq 17 ]]
          [[ "$-" != *u* ]]
          [[ "$(trap -p RETURN)" == "$original_trap" ]]

  test-ssh-personal-without-work:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow personal-only SSH setup under strict Bash mode
        shell: bash
        run: |
          HOME="$(mktemp -d)"
          export HOME
          mkdir -p "$HOME/.ssh"
          printf '%s\n' 'aws-test-key' > "$HOME/.ssh/id_ed25519_aws"
          source "$GITHUB_WORKSPACE/.devrc"

          bw() {
            case "$1" in
              --version) printf '%s\n' 'mock-bw-1.0' ;;
              login) return 0 ;;
              unlock) printf '%s\n' 'mock-session' ;;
              list) printf '%s\n' '[{"name":"SSH Personal","id":"personal-key","type":5}]' ;;
              get) printf '%s\n' '{"type":5,"sshKey":{"privateKey":"placeholder","publicKey":"ssh-ed25519 placeholder"}}' ;;
              *) return 1 ;;
            esac
          }
          ssh-add() { :; }
          ssh-agent() { :; }
          downloadGithubFiles() { return 1; }
          applyGitCredentials() { :; }

          set -euo pipefail
          useSSH

          [[ -s "$HOME/.ssh/id_ed25519" ]]
          [[ -s "$HOME/.ssh/id_ed25519_personal" ]]
          [[ ! -e "$HOME/.ssh/id_ed25519_work" ]]
          [[ ! -e "$HOME/.gitconfig-work" ]]
          if grep -q 'BEGIN JUDIGOT INCLUDEIF' "$HOME/.gitconfig"; then
            printf '%s\n' 'Work-only Git configuration must not be created without a work key' >&2
            exit 1
          fi

          if useSSH "SSH Work"; then
            printf '%s\n' 'Explicitly requested missing work key should fail' >&2
            exit 1
          fi

  test-ubuntu-unzip-missing-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up isolated HOME
        run: |
          test_home="/tmp/devrc-test-home-unzip-missing"
          rm -rf "$test_home"
          mkdir -p "$test_home"
          printf '%s\n' "baseline" >"$test_home/.bashrc"
          printf '%s\n' "export HOME=\"$test_home\"" >>"$GITHUB_ENV"

      - name: Assert updateUserEnv works without unzip
        run: |
          cp "$GITHUB_WORKSPACE/.devrc" "$HOME/.devrc"
          cp "$GITHUB_WORKSPACE/ALIAS" "$HOME/ALIAS"
          mkdir -p /tmp/fakeunzip
          printf '%s\n' '#!/bin/sh' 'exit 1' > /tmp/fakeunzip/unzip
          chmod +x /tmp/fakeunzip/unzip
          export PATH="/tmp/fakeunzip:$PATH"

          # shellcheck source=/dev/null
          source ~/.devrc

          bashrc_before="$(cksum "$HOME/.bashrc" | awk '{print $1 ":" $2}')"
          updateUserEnv >/tmp/updateUserEnv-unzip-missing.txt 2>&1
          bashrc_after="$(cksum "$HOME/.bashrc" | awk '{print $1 ":" $2}')"

          if [ "$bashrc_before" != "$bashrc_after" ]; then
            echo "✗ updateUserEnv modified .bashrc on non-Windows (unexpected)"
            exit 1
          fi

          echo "✓ updateUserEnv succeeded without unzip"

  test-non-windows-minimal-updater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up isolated HOME
        run: |
          test_home="/tmp/devrc-test-home"
          rm -rf "$test_home"
          mkdir -p "$test_home"
          printf '%s\n' "baseline" >"$test_home/.bashrc"
          printf '%s\n' "export HOME=\"$test_home\"" >>"$GITHUB_ENV"

      - name: Assert updateUserEnv is minimal on non-Windows
        run: |
          cp "$GITHUB_WORKSPACE/.devrc" "$HOME/.devrc"
          cp "$GITHUB_WORKSPACE/ALIAS" "$HOME/ALIAS"
          # shellcheck disable=SC1090
          source ~/.devrc

          bashrc_before="$(cksum "$HOME/.bashrc" | awk '{print $1 ":" $2}')"
          output_file="/tmp/updateUserEnv-output.txt"
          updateUserEnv >"$output_file" 2>&1
          bashrc_after="$(cksum "$HOME/.bashrc" | awk '{print $1 ":" $2}')"

          if [ "$bashrc_before" != "$bashrc_after" ]; then
            echo "✗ updateUserEnv modified .bashrc on non-Windows (unexpected)"
            exit 1
          fi

          awk '
            index($0, "Dotfiles synced") { bad=1 }
            index($0, "IDE files synced") { bad=1 }
            index($0, "Ubuntu WSL synced") { bad=1 }
            END { exit bad }
          ' "$output_file" || { echo "✗ updateUserEnv ran full sync on non-Windows (unexpected)"; exit 1; }

          echo "✓ non-Windows minimal updater behavior confirmed"

